name: ci
on:
  pull_request: { branches: [main, staging] }
  push: { branches: [main] }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: pm_test }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - name: Layout lint (feature-module-layout)
        run: npm run lint:layout
        continue-on-error: true # known: BDD case-table header exceeds the 4-line comment cap — see README "Known lint conflicts"
      - name: BDD lint
        run: npm run lint:bdd
        continue-on-error: true # known: trades/settlements have no 3rd-party hop, so no R-T rows — see README
      - name: BDD files
        run: npm test
        env: { TEST_DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/pm_test' }
