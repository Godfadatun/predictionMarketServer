# ci-workflow.yml — required checks. Rule: SKILL.md → When to use (main + staging on PR, nightly newman).
# Copy into .github/workflows/bdd.yml (or translate to Bitbucket Pipelines) and replace [..].
name: bdd-feature-proof
on:
  pull_request: { branches: [main, staging] }
  schedule: [{ cron: '0 1 * * *' }]   # nightly 01:00 UTC → counter-tests vs staging
jobs:
  bdd:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      db: { image: '[DB_IMAGE]', ports: ['[DB_PORT]:[DB_PORT]'], env: { '[DB_ENV]': test } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Lint BDD files
        run: for f in $(git ls-files '**/*.bdd.spec.ts'); do node files/bdd-lint.js "$f" || exit 1; done
      - name: Run BDD files
        run: npx jest --runInBand --testPathPattern='\.bdd\.spec\.ts$'
        env: { DATABASE_URL: '[TEST_DATABASE_URL]', LOG_REDACTION_KEY: '${{ secrets.TEST_LOG_REDACTION_KEY }}' }
  counter:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx newman run '[FEATURE_NAME].postman_collection.json' --env-var baseUrl=${{ secrets.STAGING_BASE_URL }} --env-var adminToken=${{ secrets.STAGING_ADMIN_TOKEN }} --reporters cli,junit
      # add: npx playwright test --config=[PLAYWRIGHT_CONFIG]   # only when the feature has a UI
